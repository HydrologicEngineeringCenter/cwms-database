

def extension = project.extensions.create("database",DatabaseExtension)
extension.image.convention("gvenzl/oracle-free:23.5-full-faststart")
extension.buildUser.convention("builduser")
extension.buildUserPassword.convention("buildpassword")

tasks.register("startDatabase", StartDatabaseTask) {
    url.convention(project.findProperty("flyway.url"))
    username.convention(project.findProperty("flyway.user"))
    password.convention(project.findProperty("flyway.password"))
    outputFile.convention(project.layout.buildDir.file("flyway.conf"))
    
}