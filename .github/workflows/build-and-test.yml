---
name: Build And Test CWMS Database
on:
  push:
    branches:
      - devops/flyway_migration
  pull_request:
    branches:
      - devops/flyway_migration

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4.2.2
      - name: Clean Runner
        uses: ./.github/actions/clean-runner
      - name: setup java
        uses: actions/setup-java@v4.6.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Oracle Tools
        id: cache-oracle-tools
        uses: ./.github/actions/setup-oracle-clients
      - name: Test Migration Code
        run: ./gradlew schema:test --info
      - name: Build schema application
        run: ./gradlew schema:build
      - name: Integration Tests
        run: ./gradlew integrationtests:test --info\
      # On the TODO list
      # - name: Generate Bundle (docs and schemas)
      #   working-directory: schema
      #   run: ant bundle -Dbuilduser.overrides=build/overrides.external.xml -Doracle.image=gvenzl/oracle-free:23.6-full-faststart
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure() # always run even if the previous step fails
        with:
          annotate_only: true
          include_passed: true
          report_paths: '**/build/**/TEST-*.xml'
