---
name: Build And Test CWMS Database
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout code
        uses: actions/checkout@v4.2.2
      - name: setup java
        uses: actions/setup-java@v4.6.0
        with:
          distribution: 'temurin'
          java-version: '8'
      - name: Info
        run: |
          pwd
          ls -l
          ls -l schema/
          ls -l .github/workflows/
      - name: Start Database
        uses: ./.github/actions/start-database
      - name: Run Tests
        working-directory: schema
        run: ant test -Dbuilduser.overrides=build/overrides.external.xml -Doracle.image=gvenzl/oracle-free:23.4-full-faststart
      - name: Generate Bundle (docs and schemas)
        working-directory: schema
        run: ant bundle -Dbuilduser.overrides=build/overrides.external.xml -Doracle.image=gvenzl/oracle-free:23.4-full-faststart
      - name: Remove database container
        if: success() || failure() # always run even if the previous step fails
        working-directory: schema
        run: ant docker.killdb -Dbuilduser.overrides=build/overrides.external.xml -Doracle.image=gvenzl/oracle-free:23.4-full-faststart
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure() # always run even if the previous step fails
        with:
          annotate_only: true
          include_passed: true
          report_paths: 'schema/build/test*.xml'
