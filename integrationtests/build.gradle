plugins {
    id 'database.deps-conventions'
    id 'base'
    id 'cwms.database.test-database' version 'local'
}

configurations {
    utplsql
}

dependencies {
    utplsql 'org.utplsql:utplsql:3.1.14@zip'
}

def cwms_schema_name = project.findProperty("cwms.schema") ?: "CWMS_20"
def cwms_office = project.findProperty("cwms.office") ?:"SPK"
def cwms_eroc = project.findProperty("cwms.eroc") ?:"l2"
def create_users = project.hasProperty("testaccounts") ? "create" : "nocreate"
def pd_password = project.findProperty("cwms.pd_password") ?: project.findProperty("flyway.password")
def test_password = project.findProperty("cwms.test_password") ?: pd_password

var sysPassword = {database.buildUserPassword}
def cwms_user = {database.buildUser.get() + "[CWMS_20]"}
import cwms.database.testing.support.DatabaseService
def database = project.gradle.sharedServices.registerIfAbsent("database", DatabaseService) {

} 

def checkTestSetup = tasks.register("checkTestSetup") {
    usesService(database)
    doFirst {
        def dbUrl = database.get().url
        def result = exec {
            executable "sqlplus"
            args "-h"
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
            errorOutput = new ByteArrayOutputStream()
        }

        if( result.getExitValue() !=0){
            throw new GradleException("sqlplus must be available for test framework to execute")
        }

        result = exec {
            executable "utplsql"
            args "-h"
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
            errorOutput = new ByteArrayOutputStream()
        }

        if( result.getExitValue() != 0 ) {
            throw new GradleException("utplsql-cli must be installed and in PATH for tests to run")
        }


        if( sysPassword == null) {
            throw new GradleException("Tests can only be run if db.sys_password is set.")
        }

        if( dbUrl == null ){
            throw new GradleException("Test framework assumes you are allow running flyway Migrate tasks, please set flyway.url")
        }
    }
}

def downloadUtplSql = tasks.register("downloadUtplSql", Copy) {
    dependsOn checkTestSetup
    from zipTree(configurations.utplsql.singleFile)
    into "$buildDir/deps"
    doLast {
        File createOwner = new File("$buildDir/deps/utPLSQL/source/create_utplsql_owner.sql")
        createOwner.withWriterAppend( { out ->
            out.println("\ngrant execute on dbms_lob to &ut3_user;")
            out.println("grant execute on dbms_random to &ut3_user;")
	  		out.println("grant execute on dbms_random to &ut3_user;")
	  		out.println("grant execute on dbms_sql to &ut3_user;")
        })
    }
}

def installTestFramework = tasks.register("installTestFramework", DatabaseExecTask ) {
    dependsOn downloadUtplSql
    dependsOn checkTestSetup
    usesService(database)
    url = database.get().url
    user = database.get().buildUser
    password = database.get().buildUserPassword
    

    executable "sqlplus"
    argumentProviders.add({[
        String.format("%s/\"%s\"@%s as sysdba","sys", password.get(), url.get()),
        "@install_headless_with_trigger.sql"
    ]} as CommandLineArgumentProvider)
    ignoreExitValue true
    workingDir "$buildDir/deps/utPLSQL/source"
    doLast {
        exec {
            executable "sqlplus"
            argumentProviders.add({[
                String.format("sys/%s@%s as sysdba", password.get(), url.get())
            ]} as CommandLineArgumentProvider)
            standardInput = new ByteArrayInputStream("GRANT INHERIT PRIVILEGES ON USER sys TO ut3;".getBytes())

        }
    }
}


def installTests = tasks.register("installTests", DatabaseExecTask) {
    dependsOn installTestFramework
    usesService(database)    
    user = "tmp"
    url ="tmp"
    password = "tmp"
    workingDir "src/test/utplsql"
    executable "sqlplus"
    argumentProviders.add({[
        String.format("%s/\"%s\"@%s", database.get().cwmsUser, database.get().buildUserPassword, database.get().url),
        "@tests.sql",
        cwms_office,
        cwms_schema_name,
        cwms_eroc + "hectest_up",
        cwms_eroc
    ]} as CommandLineArgumentProvider) 
    doLast {
        exec {
            executable "sqlplus"
            workingDir "src/test/utplsql"
            argumentProviders.add({[
                String.format("sys/%s@%s as sysdba",database.get().sysPassword,database.get().url),
                "@test_grants.sql",
                "${cwms_eroc}cwmspd".toString(),
			    "${cwms_eroc}hectest_ro".toString(),
			    "${cwms_eroc}hectest_db".toString(),
			    "${cwms_eroc}hectest_pu".toString(),
			    "${cwms_eroc}hectest_up".toString(),
			    "${cwms_schema_name}".toString(),
                "${cwms_eroc}hectest".toString(),
                "${cwms_eroc}webtest".toString(),
                "${cwms_eroc}hectest_multioffice".toString()
            ]} as CommandLineArgumentProvider
            )        			
        }
    }
}
import cwms.database.testing.support.UtTest
def cleanTestData = tasks.register("cleanTestData", cwms.database.testing.support.UtTest) {
    dependsOn installTests
    tests = ["test_clean_all"]
    outputs.upToDateWhen { false } // we always run this task
    user = "cwmspd"
}

def loadTestData = tasks.register("loadTestData", DatabaseExecTask) {
    dependsOn installTests
    dependsOn cleanTestData
    usesService(database)
    url = database.get().url
    user = database.get().cwmsUser
    password = database.get().buildUserPassword

    workingDir "${projectDir}/src/test/data/ratings"
    executable "sqlldr"
    argumentProviders.add({[
        "${user.get()}/\"${password.get()}\"@${url.get()}".toString(),
        "control=xsl_test_clobs.ctl"
    ]} as CommandLineArgumentProvider)
}

def testAsPdUser = tasks.register("testAsPdUser", cwms.database.testing.support.UtTest) {
    dependsOn installTests
    dependsOn loadTestData
    //args "-p=${cwms_schema_name}.test_cwms_rating,${cwms_schema_name}.test_lrts_updates,${cwms_schema_name}.test_probability_parameter,${cwms_schema_name}.test_cwms_loc,${cwms_schema_name}.test_cwms_ts,${cwms_schema_name}.test_cwms_util,${cwms_schema_name}.test_cwms_prop,${cwms_schema_name}.test_versioned_time_series,${cwms_schema_name}.test_update_ts_extents,${cwms_schema_name}.test_cwms_pool,${cwms_schema_name}.test_timeseries_snapping,${cwms_schema_name}.test_cwms_cat,${cwms_schema_name}.test_cwms_msg,${cwms_schema_name}.test_cwms_level,${cwms_schema_name}.test_cwms_display"
    tests = ["test_cwms_level",
             "test_cwms_rating",
             "test_lrts_updates"]
    user = "cwmspd"
}

def testAsRoUser = tasks.register("testAsRoUser", cwms.database.testing.support.UtTest ) {
    dependsOn installTests
    dependsOn loadTestData
    tests = ["test_ro"]
    user = "hectest_ro"
}


def testDb = tasks.register("testDb") {    
    dependsOn installTests

    dependsOn cleanTestData
    dependsOn loadTestData
    dependsOn testAsPdUser
    //dependsOn testAsRoUser
}

def test = tasks.register("test") {
    dependsOn testDb
}
